<!doctype html>
<html lang="ta">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>தமிழ் வாசிப்பு ஆய்வு</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Tamil:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f7f6f2; --card: #ffffff; --ink: #1d1d1f; --muted: #5f6368;
    --accent: #0b6e4f; --accent-ink: #ffffff; --line: #dedbd2; --warn: #b3261e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Noto Sans Tamil", system-ui, sans-serif; line-height: 1.7;
  }
  main { max-width: 1040px; margin: 0 auto; padding: 32px 16px 64px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 28px 32px; }
  h1 { font-size: 1.6rem; margin: 0 0 8px; }
  h2 { font-size: 1.25rem; margin: 0 0 12px; }
  .en { color: var(--muted); font-size: 0.92rem; font-family: system-ui, sans-serif; }
  label { display: block; margin: 14px 0 4px; font-weight: 600; }
  input[type=text], input[type=number], select {
    font: inherit; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; width: 100%; max-width: 360px;
  }
  .check { display: flex; gap: 10px; align-items: flex-start; margin-top: 18px; font-weight: 400; }
  .check input { margin-top: 7px; }
  button.btn {
    font: inherit; font-weight: 600; background: var(--accent); color: var(--accent-ink);
    border: 0; border-radius: 8px; padding: 10px 22px; margin-top: 22px; cursor: pointer;
  }
  button.btn.secondary { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
  button.btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .error { color: var(--warn); margin-top: 10px; }
  ol li { margin-bottom: 6px; }
  kbd { border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 6px; font-family: system-ui; }

  /* ---- reading trial ---- */
  .trial-top { display: flex; justify-content: space-between; color: var(--muted); font-size: 0.9rem; margin-bottom: 18px; }
  .stage {
    position: relative; background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 70px 60px 90px; min-height: 300px; user-select: none; -webkit-user-select: none;
  }
  .stage.reading { cursor: none; }
  .text { font-size: 30px; line-height: 2.4; word-spacing: 0.3em; }
  .text .w { white-space: nowrap; }
  .blurred { filter: blur(var(--blur, 4px)); }
  .clear {
    position: absolute; inset: 70px 60px 90px 60px; pointer-events: none;
    --mx: -999px; --my: -999px;
    -webkit-mask-image: radial-gradient(ellipse var(--rx) var(--ry) at var(--mx) var(--my), #000 60%, transparent 100%);
            mask-image: radial-gradient(ellipse var(--rx) var(--ry) at var(--mx) var(--my), #000 60%, transparent 100%);
  }
  .startdot {
    position: absolute; width: 22px; height: 22px; border-radius: 50%;
    background: var(--accent); border: 4px solid #cfe8df; cursor: pointer; padding: 0;
  }
  .hint { text-align: center; color: var(--muted); margin-top: 14px; }
  .probe-word { font-size: 2.2rem; font-weight: 600; text-align: center; margin: 28px 0; }
  .row { display: flex; gap: 16px; justify-content: center; }
  .row .btn { min-width: 140px; }
</style>
</head>
<body>
<main id="app"></main>
<script src="config.js"></script>
<script src="stimuli.js"></script>
<script src="motr.js"></script>
</body>
</html>
